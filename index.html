<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flood</title>
  <style>
    html, body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; background: #b3cfe0; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #hud {
      position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
      font: 600 14px/1.3 system-ui, sans-serif; color: #10303d; pointer-events: none;
      background: #eaf5fbd9; padding: 8px 12px; border-radius: 10px;
    }
    #hud h1 { margin: 0; font-size: 22px; letter-spacing: 0.12em; }
    #stats { margin-top: 6px; font-size: 16px; }
    #dist { font-size: 20px; }
    #banner {
      position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); padding: 18px 26px; border-radius: 14px;
      background: #0e3442cc; color: #eefaff; font: 16px/1.4 system-ui, sans-serif; text-align: center; display: grid; gap: 4px;
      pointer-events: none; max-width: calc(100vw - 32px); box-sizing: border-box;
    }
    #banner b { font-size: 24px; }
    #banner[hidden] { display: none; }
    #help { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center;
      font: 13px system-ui, sans-serif; color: #10303dcc; pointer-events: none; }
    #rank { font-size: 18px; font-weight: 800; }
    #feed { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
      display: grid; gap: 4px; justify-items: end; pointer-events: none; font: 600 13px system-ui, sans-serif; max-width: 45vw; }
    #feed div { background: #0e3442cc; color: #eefaff; padding: 4px 10px; border-radius: 8px; }
    #litres::before { content: "💧 "; }
    #pop { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font: 800 28px system-ui, sans-serif;
      color: #e8fbff; text-shadow: 0 2px 6px #0b3a4a; opacity: 0; pointer-events: none; }
    #pop.show { animation: pop 1.5s ease-out forwards; }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 12px) scale(0.9); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
      70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -24px) scale(1); } }
    @media (prefers-reduced-motion: reduce) { #pop.show { animation: none; opacity: 1; } }
    #status { position: fixed; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      background: #0e3442d9; color: #eefaff; padding: 8px 14px; border-radius: 10px; font: 600 15px system-ui, sans-serif;
      max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; pointer-events: none; }
    #status[hidden], #menu[hidden] { display: none; }
    #menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100vw - 32px));
      box-sizing: border-box; background: #0e3442e6; color: #eefaff; border-radius: 16px; padding: 22px; display: grid; gap: 12px;
      font: 15px/1.4 system-ui, sans-serif; text-align: center; }
    #menu h2 { margin: 0; font-size: 34px; letter-spacing: 0.14em; }
    #menu p { margin: 0 0 4px; color: #cfe8f2; }
    #menu input, #menu button { font: 600 17px system-ui, sans-serif; padding: 12px; border-radius: 10px; border: 0; }
    #menu input { background: #eaf5fb; color: #10303d; text-align: center; }
    #menu button { background: #45d2ff; color: #062430; cursor: pointer; }
    #menu button.alt { background: transparent; color: #eefaff; outline: 2px solid #45d2ff88; }
    #fallback { position: fixed; inset: 0; display: grid; place-items: center; font: 16px system-ui; color: #10303d; }
    #fallback[hidden] { display: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud"><h1>FLOOD</h1><div id="stats"><div id="rank"></div><div id="dist"></div><div id="litres"></div><div id="time"></div></div></div>
  <div id="banner" hidden></div>
  <div id="pop"></div>
  <div id="feed"></div>
  <div id="help">Steer: ← → or A D · on a phone, hold the left or right side · M: map</div>
  <div id="status" hidden></div>
  <div id="menu">
    <h2>FLOOD</h2>
    <p>Every player is a river. Swallow lakes, cut rivals off, reach the sea first.</p>
    <input id="name" maxlength="12" placeholder="Your name" autocomplete="nickname">
    <button id="play-online">Play online</button>
    <button id="play-solo" class="alt">Solo vs bots</button>
  </div>
  <div id="fallback" hidden></div>
  <script type="module" src="./src/client/main.js"></script>
</body>
</html>
