name: pages
on:
  push:
    branches: [main, ccr-8ebb946e-i3t5fj]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the public browser files (the same allowlist the Node server serves).
      - run: |
          mkdir -p _site/src
          cp index.html _site/
          cp -r src/client src/shared _site/src/
          cp -r vendor assets _site/
          # Version every relative import and the entry script with the commit, so a
          # browser never mixes a new module with a stale cached one; stamp the build id.
          v=${GITHUB_SHA::7}
          find _site/src -name '*.js' -print0 | xargs -0 sed -i -E "s#(from |import\()'(\.\.?/[^']+\.js)'#\1'\2?v=$v'#g"
          sed -i -E "s#src=\"\./src/client/main\.js\"#src=\"./src/client/main.js?v=$v\"#" _site/index.html
          sed -i "s#__BUILD__#$v#" _site/src/client/main.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
